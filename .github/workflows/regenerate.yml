name: Regenerate client
on:
  schedule:
    - cron: '0 6 * * 2' # Tuesdays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: regenerate-client
  cancel-in-progress: false
jobs:
  regenerate:
    name: Regenerate client from upstream spec
    runs-on: ubuntu-latest
    steps:
      # persist-credentials stays on: create-pull-request pushes via the
      # checkout's git credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Regenerate client
        run: tools/regenerate-client.sh
      - name: Open PR if the client changed
        id: pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: chore/regenerate-client
          delete-branch: true
          commit-message: 'regen: refresh client from upstream spec'
          title: 'regen: refresh client from upstream spec'
          labels: |
            regenerate
          body: |
            Automated regeneration via `tools/regenerate-client.sh` (scheduled workflow).

            The upstream Hugging Face Hub OpenAPI spec changed. Review
            `SPEC_DEVIATIONS.md` and the diff of `openapi.processed.json`
            before merging.
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          # Squash keeps main linear; --auto waits for required checks on every
          # push to the branch (no-op no-merge if the PR later goes red).
          gh pr merge --auto --squash \
            --subject 'regen: refresh client from upstream spec' \
            --body '' "$PR_URL"
